name: Catalog and shared runtime tests
on: [push, pull_request]
jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/generate_registry.py --check
      - run: python tools/generate_languages.py --check
      - run: python -m unittest discover -s tests -v
